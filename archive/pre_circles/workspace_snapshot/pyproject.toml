[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "runs/.pytest_cache"

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["runs", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
