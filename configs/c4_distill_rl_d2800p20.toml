# DIST-RL STUDENT_RL (DISTILL, 2026-11-09): RL-ONLY fine-tune of the BC STUDENT (lane-on MAPPO_LANE actor
# format, imitation of the cooperative controller) with the ORIGINAL MAPPO objective and code -- NO imitation
# loss.  Clean comparison with MAPPO_CT (AMENDMENT 30, configs/c4_mappo_ct_d2800p20.toml).
# = configs/c4_mappo_lane_wz3to2.toml (S-MAPPOWZL lane-on recipe) with EXACTLY the MAPPO_CT [rollout] deltas
#   (asserted by tests/unit/test_distill_rl.py):
#   - demands_vph [2800], penetrations [0.2] (D2800_p20), iterations 12, episodes_per_iteration 8 (96 episodes),
#     max_sumo_seconds 57,600 (= 12 x 8 x 600 controlled s), keep_every 4 (exports 4/8/12);
#   - seeds: "@DISTILL_RL_SEEDS@" placeholder, rendered at launch to the DIST-REG fresh block (MAPPO_CT's
#     989200-989587 is registered to phase mappo_ct only and is off-limits to DISTILL); the block is opened
#     to the map seed guard only by COOPMWM_EXTRA_TRAIN_RANGES in the PLAN env.
# Hence vs MAPPO_CT the ONLY differences are: lane head ON (lane_control learned, LCEXEC lane action set and
# writer, lane entropy 0.01 -- the lane-on MAPPO recipe), init = the STUDENT exported actor (pinned sha256;
# lane head loaded, critic / optimisers / return scaler / Lagrange multiplier fresh exactly as MAPPO_CT),
# and the training seed block.  PPO clip 0.2 / 4 epochs / target KL 0.03 / lr / entropy / value / grad clip,
# reward weights (delay 1, throughput 0.5, smooth 0.05, hard_brake 1, fairness 1 = CVaR90 per-vehicle delay,
# TTC 3 s Lagrangian cost limit 3.6) and episode shape (300 s warmup + 600 s control) are IDENTICAL.
# No KL-to-student anchor (MAPPO_CT has none); no imitation term.

[map]
name = "wz3to2"
api = "tools.nm_mappo.n1_adapter:descriptor"   # N1 map API (c4/nm-abstract b2f30091); "" = refusing stub

[policy]
lane_control = "learned"                 # lane head ON (stay/left/right), fresh head on u0
lane_actions = "tools.nm_mappo.lane_actions:lcexec"   # clean5 lane action set (LCEXEC gate)
accel_max_mps2 = 2.6                     # = stored bound of MAPPO u0 (d9042cc5) and v5 (aecd7d70)

[mappo]                                  # PPO hyperparameters (identical to the original)
gamma = 0.99
gae_lambda = 0.95
clip_eps = 0.2
clip_value_eps = 0.2
epochs = 4
minibatch_frames = 1024
lr_actor = 3.0e-4
lr_critic = 1.0e-3
entropy_coef = 0.01
lane_entropy_coef = 0.01                 # lane head entropy (= the original lane-on MAPPO v5)
value_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.03
cost_limit_per_step = 3.6
lagrange_lr = 0.01
lagrange_max = 50.0
return_norm = true
grad_noise_every = 5
eval_chunk_frames = 512

[rollout]
seed = 1
iterations = 12                          # = MAPPO_CT (AMENDMENT 30): 12 updates
episodes_per_iteration = 8                # = MAPPO_CT: 8 episodes per update (96 total)
horizon_s = 600.0
warmup_s = 300.0
warmup_choices_s = []
penetrations = [0.2]                     # = MAPPO_CT: D2800_p20 (N1 registered cell)
penetration_mode = "discrete"
demands_vph = [2800]                     # = MAPPO_CT: D2800_p20 (N1 registered cell)
seeds = "@DISTILL_RL_SEEDS@"             # DIST-REG fresh TRAIN block, rendered by tools/nm_mappo/distill_rl.py
max_sumo_seconds = 57600.0               # = MAPPO_CT: controlled s = 12 x 8 x 600 (warmup uncharged)
max_env_steps = 0
charge_warmup = false
retries = 1
episode_timeout_s = 3600.0
keep_last = 3
keep_every = 4                           # = MAPPO_CT: exports/checkpoints at updates 4, 8, 12
update_threads = 16

[lanes]                                  # identical (= configs/c4_policy.toml [lanes])
gap_base_m = 1.0
gap_time_s = 1.2
closing_time_s = 4.5
rear_gap_base_m = 3.0
rear_gap_time_s = 1.25
rear_closing_time_s = 6.0
dwell_s = 3.0
edge_guard_m = 10.0

[env]
name = "map"                             # env class + map kwargs from the N1 descriptor
cleanup_scenarios = true
kwargs = { ttc = false, physics_log = false, population = "textbook", lane_writer = "lcexec" }

[reward_weights]                         # identical
delay = 1.0
throughput = 0.5
smooth = 0.05
hard_brake = 1.0
fairness = 1.0
ttc_limit_s = 3.0

[smoke]                                  # --smoke: CPU fake env, no SUMO (identical to the original)
env_name = "fake"
env_kwargs = {}
iterations = 2
episodes_per_iteration = 2
horizon_s = 6.0
warmup_s = 0.0
max_sumo_seconds = 64.0
epochs = 2
minibatch_frames = 4
target_kl = 0.0
