# MAPPO baseline for WM-S C4 (docs/WM_C4_DESIGN.md section 3, step 4b).
#
# Model-free MAPPO trained directly in SUMO on the SAME observations, actions
# and team reward as the C4 policy, at a matched SUMO-seconds budget
# (max_sumo_seconds).  Partner modules are referenced by dotted name and
# imported lazily by the CLI (python -m wms.control.mappo.train).  The
# "fake*" shortcuts in each name field select wms.control.mappo.fakeenv
# stand-ins (CPU smoke / tests, no SUMO).  See MAPPO_NOTES.md.

[mappo]                                  # PPO hyperparameters
gamma = 0.99                             # discount per 1 s control step
gae_lambda = 0.95
clip_eps = 0.2                           # PPO policy clip
clip_value_eps = 0.2                     # value clip
epochs = 4                               # minibatch epochs per iteration
minibatch_size = 512                     # per-CAV samples (control step x slot)
lr_actor = 3.0e-4
lr_critic = 1.0e-3
entropy_coef = 0.01
value_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.03                          # per-iteration early stop (approx KL)
cost_limit_per_step = 0.02               # Lagrangian limit on mean team cost_ttc
lagrange_lr = 0.05
lagrange_max = 50.0
return_norm = true                        # critic predicts scaled returns

[rollout]
seed = 1
iterations = 1000                         # upper bound; the budget usually stops first
episodes_per_iteration = 8
horizon_s = 300.0                         # one episode = 300 control steps
warmup_s = 60.0
penetrations = [0.05, 0.1, 0.2, 0.4]      # training mix (unseen eval: 15/30/60/2 %)
demands_vph = [2400, 2600, 2700]
max_sumo_seconds = 1.0e6                  # SUMO budget; match to the C4 run
max_env_steps = 0                         # 0 = no env-step cap (SUMO-seconds governs)
charge_warmup = false                     # charge controlled seconds only

[env]
name = "traffic_shepherd.c4.CavSumoEnv"   # contract.CavEnv implementation
kwargs = {}

[policy]
actor = "wms.control.policy.CavPolicy"            # same architecture class as C4
actor_kwargs = {}
group_encoder = "wms.control.policy.RsuGroupEncoder"
group_encoder_kwargs = {}
critic = "wms.control.policy.TeamCritic"          # privileged centralised critic
obs_builder = "wms.control.obs.build_observations"
team_reward = "wms.control.reward.team_reward"
safety = "wms.control.safety.safe_accel"

[reward_weights]                         # wms.control.contract.RewardWeights
delay = 1.0
throughput = 0.5
smooth = 0.05
hard_brake = 1.0
fairness = 1.0
ttc_limit_s = 3.0

[smoke]                                  # --smoke overrides: CPU-only fake pipeline
env_name = "fake"
iterations = 2
episodes_per_iteration = 2
horizon_s = 6.0
warmup_s = 0.0
max_sumo_seconds = 64.0
epochs = 2
minibatch_size = 64
target_kl = 0.0                           # 0 = disabled
actor = "fake_actor"
group_encoder = "fake_encoder"
critic = "fake_critic"
obs_builder = "fake_obs"
team_reward = "fake_reward"
safety = "fake_safety"
