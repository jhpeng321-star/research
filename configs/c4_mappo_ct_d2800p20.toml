# MAPPO_CT (AMENDMENT 30, REGISTRATION 2026-11-09 15:29): the frozen U0 MAPPO speed policy
# (MAPPO u0 = S-MAPPOSPEED production2/policy_00169.pt sha256 d9042cc5..., the actor inside the U0
# u0.pt 5ea22964 bound in amendments 27/28) continues training with its ORIGINAL MAPPO objective and
# code (S-MAPPOWZ config c4_mappo_speed_wz3to2.toml = the S-MAPPOSPEED recipe on wz3to2) at D2800_p20.
# Declared deltas vs c4_mappo_speed_wz3to2.toml (everything else byte-identical):
#   - [rollout] demands_vph = [2800], penetrations = [0.2]: the D2800_p20 cell of the p20c panel;
#   - [rollout] iterations = 12, episodes_per_iteration = 8 (96 episodes, matched to the cooperative
#     runs' 12 updates x 8 episodes), max_sumo_seconds = 57,600 (= 12 x 8 x 600 controlled s);
#   - [rollout] seeds = "989200-989587": registered wz3to2 TRAIN block minus the S-MAPPOWZ/N1 sanity
#     worlds 989588-989599 (never HELD-OUT 989600-989699, 9896xx, 993xxx, 964000-964199, 962xxx,
#     977xxx, 989950-989999, 991xxx);
#   - [rollout] keep_every = 4: exports/checkpoints at updates 4, 8, 12.
# PPO hyperparameters, episode shape (300 s warmup + 600 s control), reward weights, TTC budget,
# lane rules, actor/encoder/critic, rollout RNG seed are IDENTICAL to S-MAPPOWZ / S-MAPPOSPEED.
#   python -m wms.control.mappo.train --config configs/c4_mappo_ct_d2800p20.toml --workers 8 --out DIR \n#       --init-from <u0 policy_00169.pt, sha256 d9042cc5...> --update-threads 16

[map]
name = "wz3to2"
api = "tools.nm_mappo.n1_adapter:descriptor"   # N1 map API (c4/nm-abstract b2f30091); "" = refusing stub

[policy]
lane_control = "native"                  # speed-only: no lane head; lanes=None -> SUMO-native lane changes
accel_max_mps2 = 2.6                     # = stored bound of MAPPO u0 (d9042cc5) and v5 (aecd7d70)

[mappo]                                  # PPO hyperparameters (identical to the original)
gamma = 0.99
gae_lambda = 0.95
clip_eps = 0.2
clip_value_eps = 0.2
epochs = 4
minibatch_frames = 1024
lr_actor = 3.0e-4
lr_critic = 1.0e-3
entropy_coef = 0.01
lane_entropy_coef = 0.01                 # inert in native mode (no lane head)
value_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.03
cost_limit_per_step = 3.6
lagrange_lr = 0.01
lagrange_max = 50.0
return_norm = true
grad_noise_every = 5
eval_chunk_frames = 512

[rollout]
seed = 1
iterations = 12                          # AMENDMENT 30: 12 updates
episodes_per_iteration = 8                # AMENDMENT 30: 8 episodes per update (96 total)
horizon_s = 600.0
warmup_s = 300.0
warmup_choices_s = []
penetrations = [0.2]                     # D2800_p20 (N1 registered cell)
penetration_mode = "discrete"
demands_vph = [2800]                     # D2800_p20 (N1 registered cell)
seeds = "989200-989587"                  # registered wz3to2 TRAIN block minus sanity worlds 989588-989599
max_sumo_seconds = 57600.0               # controlled s = 12 x 8 x 600 (warmup uncharged, as original)
max_env_steps = 0
charge_warmup = false
retries = 1
episode_timeout_s = 3600.0
keep_last = 3
keep_every = 4                           # exports/checkpoints at updates 4, 8, 12
update_threads = 16

[lanes]                                  # identical (= configs/c4_policy.toml [lanes])
gap_base_m = 1.0
gap_time_s = 1.2
closing_time_s = 4.5
rear_gap_base_m = 3.0
rear_gap_time_s = 1.25
rear_closing_time_s = 6.0
dwell_s = 3.0
edge_guard_m = 10.0

[env]
name = "map"                             # env class + map kwargs from the N1 descriptor
cleanup_scenarios = true
kwargs = { ttc = false, physics_log = false, population = "textbook" }

[reward_weights]                         # identical
delay = 1.0
throughput = 0.5
smooth = 0.05
hard_brake = 1.0
fairness = 1.0
ttc_limit_s = 3.0

[smoke]                                  # --smoke: CPU fake env, no SUMO (identical to the original)
env_name = "fake"
env_kwargs = {}
iterations = 2
episodes_per_iteration = 2
horizon_s = 6.0
warmup_s = 0.0
max_sumo_seconds = 64.0
epochs = 2
minibatch_frames = 4
target_kl = 0.0
