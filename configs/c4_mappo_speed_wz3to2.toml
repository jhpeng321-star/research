# N7: FAIR speed-only MAPPO comparator on the wz3to2 lane-drop map (MAPPO_WZ_PLAN.md).
#
# = the original speed-only MAPPO recipe (S-MAPPOSPEED, cpuQ ~/mappospeed/speed.toml sha256 a7fc8e09...,
#   parsed copy tools/nm_mappo/ORIGINAL_SPEED_CONFIG.json; result policy_00169.pt sha256 d9042cc5... = MAPPO u0)
#   with ONLY these declared deltas (tests/unit/test_nm_mappo.py asserts the delta set):
#   - [map] table + [env] name = "map": the env and its map-selecting kwargs come from the N1 descriptor;
#   - [rollout] seeds = registered wz3to2 TRAIN block 989200-989599 (never HELD-OUT 989600-989699,
#     never 964000-964199 / 962xxx / 977xxx; checked by wms.control.mappo.mapbind);
#   - [rollout] demands_vph = [3200], penetrations = [0.6]: the canonical clean4 cell D3200_p60 (MAIN
#     2026-11-06 15:43; the cell our method trains and is evaluated on), so MAPPO trains on exactly the
#     evaluation traffic condition (validated against the N1 registered cells);
#   - [rollout] iterations = 168 and max_sumo_seconds = 4,636,800 written into the file (the original
#     passed --iterations 169 --max-sumo-seconds 4664400 on the command line; 168 because the registered
#     phase mappo_wz <= 7,000,000 sim-s also funds the 660 smoke and the 32,400 sanity panel);
#   - [rollout] keep_every = 6 (infra only, cpuQ disk: keeps iterations 6..168 incl. the pre-registered
#     fallback snapshots 24/42/84 and the final 168; the original kept every iteration);
#   - [policy] accel_max_mps2 = 2.6 explicit (= the stored bound of the u0 / v5 actors; the original got it
#     from the --init-from checkpoint; a from-scratch run needs it explicitly);
#   - [env] cleanup_scenarios = true (infra only: each worker deletes its own regenerable scenario dirs;
#     the original retained them, ~5 GB on cpuQ).
#   PPO hyperparameters, episode shape (46 x (300 s warmup + 600 s control)), reward weights, TTC budget,
#   lane rules, actor/encoder/critic, rollout RNG seed and checkpointing are IDENTICAL.
#
#   python -m wms.control.mappo.train --config configs/c4_mappo_speed_wz3to2.toml --workers N --out DIR \
#       --init-from <u0 policy_00169.pt, sha256 d9042cc5...> --update-threads 16
# Launch via tools/nm_mappo/launch.py (preflight / registration gate / detached supervisor).

[map]
name = "wz3to2"
api = "tools.nm_mappo.n1_adapter:descriptor"   # N1 map API (c4/nm-abstract b2f30091); "" = refusing stub

[policy]
lane_control = "native"                  # speed-only: no lane head; lanes=None -> SUMO-native lane changes
accel_max_mps2 = 2.6                     # = stored bound of MAPPO u0 (d9042cc5) and v5 (aecd7d70)

[mappo]                                  # PPO hyperparameters (identical to the original)
gamma = 0.99
gae_lambda = 0.95
clip_eps = 0.2
clip_value_eps = 0.2
epochs = 4
minibatch_frames = 1024
lr_actor = 3.0e-4
lr_critic = 1.0e-3
entropy_coef = 0.01
lane_entropy_coef = 0.01                 # inert in native mode (no lane head)
value_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.03
cost_limit_per_step = 3.6
lagrange_lr = 0.01
lagrange_max = 50.0
return_norm = true
grad_noise_every = 5
eval_chunk_frames = 512

[rollout]
seed = 1
iterations = 168                         # original production2: --iterations 169 (phase cap, see header)
episodes_per_iteration = 46
horizon_s = 600.0
warmup_s = 300.0
warmup_choices_s = []
penetrations = [0.6]                     # canonical clean4 cell D3200_p60 (N1 registered cell)
penetration_mode = "discrete"
demands_vph = [3200]                     # canonical clean4 cell D3200_p60 (N1 registered cell)
seeds = "989200-989599"                  # registered wz3to2 TRAIN block
max_sumo_seconds = 4636800.0             # controlled s = 168 x 46 x 600 (warmup uncharged, as original)
max_env_steps = 0
charge_warmup = false
retries = 1
episode_timeout_s = 3600.0
keep_last = 3
keep_every = 6                           # exports/checkpoints 6..168 incl. snapshots 24/42/84 (cpuQ disk)
update_threads = 16

[lanes]                                  # identical (= configs/c4_policy.toml [lanes])
gap_base_m = 1.0
gap_time_s = 1.2
closing_time_s = 4.5
rear_gap_base_m = 3.0
rear_gap_time_s = 1.25
rear_closing_time_s = 6.0
dwell_s = 3.0
edge_guard_m = 10.0

[env]
name = "map"                             # env class + map kwargs from the N1 descriptor
cleanup_scenarios = true
kwargs = { ttc = false, physics_log = false, population = "textbook" }

[reward_weights]                         # identical
delay = 1.0
throughput = 0.5
smooth = 0.05
hard_brake = 1.0
fairness = 1.0
ttc_limit_s = 3.0

[smoke]                                  # --smoke: CPU fake env, no SUMO (identical to the original)
env_name = "fake"
env_kwargs = {}
iterations = 2
episodes_per_iteration = 2
horizon_s = 6.0
warmup_s = 0.0
max_sumo_seconds = 64.0
epochs = 2
minibatch_frames = 4
target_kl = 0.0
