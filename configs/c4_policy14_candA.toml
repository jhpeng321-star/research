# S-INTEGRATE candidate-A launch configuration (MAIN 2026-10-29 06:00).
#
# Chain: candA -> c4prep_on (entrant ON) -> c4prep_off (LONGMEM micro1/segment8,
# both offloads, full residual actor, K8, q10 pessimism, CRN, real-credit floor,
# checkpoint_every=1) -> c3longint -> ... (unchanged registered base).
#
# Bindings supplied by tools/candA/authority.py at resolve time:
#   * WM checkpoint + config + sha (morning WM choice; BOUNDARY.json/gate file
#     built by auditfix_authority for the chosen WM),
#   * CCT-2 file authority/CCT2_{wm_sha256}.json (gain-only long credit; if the
#     chosen WM has no committed CCT-2 authority, long credit stays disabled and
#     dense 90 s credit only is used - fail-closed, never inherited),
#   * C1 actor 64f70af4... (resume --new-phase).
#
# Nine-row N4 exact path (MAIN 06:00 i): the six-row preset is NOT used.
# Every default-OFF switch not listed here stays OFF (ensemble/anchor/HOLD/
# probes/critic bootstrap/exec-cap overrides).
extends = "c4_policy14_c4prep_on.toml"

[execution]
# S-EXECPARITY3 (merged): imagination (mode 2) identifies leaders by SUMO's
# lane/link rule - launch env MUST export C4_SUMO_LEADER_RULE=1 (see
# tools/candA/COMMANDS.md). The mode-2 parity receipt
# tools/execparity/alwayscmd3_execution_parity.json was measured with the rule
# ON in the mirror (pooled executed RMSE 0.146538 <= head band 0.160312,
# re-confirmed bitwise on this tree). The deployment executor path is
# unchanged (SUMO getLeader itself); flag OFF stays the frozen legacy
# default everywhere else. authority.py binds this flag plus the leader-rule
# source hashes.
leader_rule = true

[run]
gpu_memory_fraction = 0.45

[trainer]
# MAIN15:00 measured fallback stays binding: fit-free q10/K8 pessimistic credit,
# no fitted native-anchor scale.
native_anchor = false
native_anchor_calibration = ""
# S-EXPLOIT monitors ON (ASTRA4 GO condition 4). Ensemble pessimism and its STOP
# stay OFF (unqualified); anchor OFF above.
exploit_monitor = true
exploit_disable_direct_credit = true
exploit_ensemble_pessimism = false
exploit_stop_on_conflict = false
# S-AUDITFIX: per-update phase checkpoints (resume safety for --new-phase).
checkpoint_every = 1

[data]
# exact 60% focus-cell start mixture (registered)
focus_cell_fraction = 0.6

[policy14]
fd_gate = false
free_road_gate = false

[counterfactual]
# nine-row registered weights; guarded real credit floors individual at 8.9
curriculum_updates = [0, 1]
w_individual = [8.9, 8.9]
w_group = [9.9, 9.9]
w_coop = [8.9, 8.9]
w_team = [10.3, 10.3]
w_all = [1.0, 1.0]

[horizon]
# dense 90 s horizon from update 1 (registered curriculum), unchanged gates
enabled = true
horizons_s = [10, 90]
curriculum_updates = [0, 1]
entry_pad_max = [32, 288]

[long_credit]
# 02:25 CCT-2 gain-only mode: long credit only for K8-median confident-gain rows
# (predicted improvement < -2*sigma and q10 improvement > 0) up to H_G of the
# WM named by the file. Harm/below-margin rows get dense 90 s credit only.
# S-LAUNCHA 08:15 rule branch (a): WM2+learned-mix CCT-2 PASSED (H_G 300,
# panels scored with the ERRSRC LearnedMix overlay, K1 contract) -> mix ON and
# the trainer consumes the MIX-QUALIFIED authority (learned_mix_qualified=true,
# sha f42cce0f...); mismatched file => startup refusal. Mix-OFF launches use
# authority/CCT2_{wm_sha256}.json instead.
#
# S-LAUNCHA 18:25 fallback (registered 23:25 MAIN rule: 24 h projection at
# H_long, else "A starts at 90 s and the long credit is added as a registered
# second phase once the speed work makes it fit"): PHASE 1 RUNS DENSE 90 s
# ONLY. Arithmetic from the registered nine_N4 receipt (350.756 s/update at
# 90 s; phases 83.352 forward + 262.449 VJP + 4.955 other): H_long=300 ->
# 1165.8 s/update -> 48.6 h for 150 updates; H_long=180 -> 29.3 h; both > 24 h
# regardless of memory (and the 300 s VJP worker peak ~4.18 GiB * 300/90 =
# 13.9 GiB exceeds the parallel-pool 60% guard - attempt 3 OOM receipt). The
# only CCT-2-passing horizons are 180/300, so no intermediate qualifies. The
# mix-qualified authority below stays bound as the REGISTERED SECOND PHASE;
# re-enable (enabled = true) only under a new registered amendment that fits
# the 24 h rule.
enabled = false
mode = "gain_only"
cct2_file = "authority/CCT2_{wm_sha256}_mix.json"
w_long = 1.0
score_training_horizon = false
