# Proposed cycle-boundary opt-in. Not installed by S-LONGCRITIC-1.
extends = "c4_policy14_main14_nativelane.toml"

[longcritic]
enabled = true
horizons_s = [60, 120, 180, 240, 300]
every = 1
native_warmup_updates = 100
# CLI must supply --longcritic-native-returns (real native 300 s NPZ)
# and --longcritic-reliability (TRAIN pairs, bound to the accepted WM SHA).

[exploration]
long_persistence = true
persistence_curriculum_updates = [0, 150]
persistence_seconds = [30.0, 60.0]

[real_share]
enabled = true
updates = 20
