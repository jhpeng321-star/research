# C4 WORLD MODEL (WM-S-C4): the world model C4 dreams/imagines with (<= 30 s rollouts).
# Recipe = r5b.toml's (hybrid learned driver settings in the physics, grad damping 0.90,
# lane cap 1.5 + separate saturating lane gate + flip-rate loss, per-step activation
# checkpointing, per-stage truncation and lr) with the C4 changes:
#   1. model.lane_rule = "forced_merge_only" (after
#      WM-S-LANECHECK: MOBIL matches 1.5% of recorded changes; discretionary changes
#      dropped, only the mandatory ramp merge lane 2 -> 1 stays; masked logits stay
#      masked after the learned residual and cap - see LANERULE_CHECK.md).
#   2. NO warm start: trained from scratch; switching held-out family RELEASED.
#      [superseded: init_from the R5b best checkpoint (registry name ckpt_r5b_best; resolves via
#      WMS_DATA_CKPT_R5B_BEST, fails closed if unset - same pattern as r5b's stage30).
#   3. DATA: native + RANDOM direct-output CAV actions only (no designed
#      controllers in WM training). pack_v3 native/native_base TRAIN windows +
#      pack_dspeed target-speed arms + the switching pack's direct-mix arm; the
#      damping/base arm, the pack_damping pack, PI / wall / fixed / switching arms and
#      every CAL item are excluded. Lists generated by tools/make_c4_lists.py into
#      runs/active/c4_wm_lists (registered as c4_wm_lists).
#   4. CURRICULUM 10/30/60 s only (C4 imagines <= 30 s; the 120 s stage is skipped).
#      stage_steps = r5_f23_half's budget for these three stages, sized with the R5
#      timings on one RTX 4090 D (0.9 / 2.8 / 5.6 s per step at 20/60/120-step unrolls,
#      batch 8): 1250*0.9 + 1250*2.8 + 940*5.6 = 9889 s (~2.75 h) + validation
#      (val_every 200, 8 batches) ~= 3-3.5 h total <= 5 h.
# NOTE standalone on purpose: 'extends' deep-merges tables, so a child of r5b.toml
# could never drop data.packs.damping; the r5b/r5 recipe values are restated verbatim
# below (each with the config they come from).
schema_version = 2
name = "WM-S-C4"

[data]
start_shift_prob = 0.75    # r4: verified C1 start-shift probability
history_s = 60.0           # r4: R3's 60 s driver history
history_stride_s = 1.0     # r4

[data.packs]
pack_v3 = "pack_v3"
dspeed = "pack_dspeed"

[data.sidecars]
outcomes = "sidecars_packv3_v2/outcomes" # r4

[data.sidecars.identities]
pack_v3 = "sidecars_packv3_v2/identities" # r4
dspeed = "identities_dspeed"              # r4

[data.sidecars.overlays]
dspeed = "overlay_dspeed" # r4

[data.windows]
train = "c4_wm_lists/windows_train_native_c4.json"    # C4: native arms only (see tools/make_c4_lists.py)
val = "c4_wm_lists/windows_val_native_c4.json"        # C4
exclude = ["lpwo_v3/excluded_runs_PI_wall_v3.json"]   # r4: registered eval-world exclusions

[data.switching]
pack = "pack_switching_train"
identities = "identities_switching_train"
driver_params = "driver_params_switching_train"
windows_train = "c4_wm_lists/windows_train_directmix_trainpart.json" # C4: direct-mix arm, TRAIN part
windows_val = "c4_wm_lists/windows_val_directmix.json"               # C4: direct-mix monitoring part
timeline_index = "action_timeline_index_train"
zero_shot_heldout = "zero_shot_heldout"
heldout_family_policy = "release" # held-out family released for C4 training (guard file not needed)
heldout_max_drop_frac = 0.85   # r3
mix_ratio = 0.3                # r3: 30% switching-source draws (here: direct-mix only)
event_oversample = 1.0         # r3
val_frac = 0.0                 # the TRAIN-scoped world split is provided explicitly above

[model]
rollout_mode = "hybrid"     # r5_base FIX 1: encoder settings drive the physics, residual stays on
lane_rule = "learned_discretionary" # C4: no MOBIL; forced merges in physics, discretionary changes learned by the residual
# init_from: none - train the C4 world model from scratch (no warm start from R5b)
sumo_fidelity = true        # r4
n_controllers = 7           # r4
merge_cal = false           # r4
residual_soft_bound_mps2 = 4.0 # r4 (never the rejected hard cap)
lane_logit_cap = 8.0        # C4 learned_discretionary: the learned correction must be able to lift the -6 base-rate prior above stay (r5 used 1.5 against MOBIL)
checkpoint_step = true      # r5_f2 FIX 2
grad_decay_per_step = 0.90  # r5b: backward-only gradient damping through the rollout state

[model.gate]
kind = "saturating" # r4
g_max_init = 0.30
tau_steps_init = 50.0

[model.lane_gate]
kind = "saturating" # r5_f23 FIX 3b
g_max_init = 0.16
tau_steps_init = 30.0

[loss]
loss_share_logging = true # r4

[loss.residual]
residual_mag_weight = 0.01 # r4

[loss.lane_rate]
weight = 0.0               # r5_f23 FIX 3c: OFF, replaced by the flip-rate loss
target = 0.00124327163     # r4: TRUE training rate (LANECAL)

[loss.flip_rate]
weight = 1.0               # r5_f23 FIX 3c
allowance = 0.00124327163  # TRUE rate per HDV-step (LANECAL)

[curriculum]
unroll_s = [10.0, 30.0, 60.0]            # C4: 120 s skipped (C4 imagines <= 30 s)
stage_steps = [1500, 1500, 600]          # the GPU host (4080S vGPU) is CPU-bound (~1.7 s/step at 10 s, GPU 10-25 % busy): batch 16 at ~same step time, fewer steps; ~5 h
truncation_steps = 20                    # r4
truncation_steps_per_stage = [20, 60, 60] # C4 imagines <= 30 s: BPTT window 30 s in the 60 s stage (stability, time)
driver_grad_across_chunks = true         # r5_base FIX 1: encode drivers once at t0
max_hours = 6.5                          # C4 budget cap (from scratch, the GPU host)

[optim]
batch_size = 16       # the GPU host: GPU under-used at batch 8 (CPU-bound loop), so batch 16 costs ~no extra wall time
lr = 0.001            # r4/c1fast
lr_per_stage = [1.0e-3, 3.0e-4, 1.0e-4] # from scratch: c1fast lr for 10 s, then r5b-stable 3e-4/1e-4 with damping

[selection]
select_by_long_horizon = true # r4
val_batches = 8               # r4

[runtime]
device = "cuda"    # GPU recipe only; local preflight/smoke override to cpu
threads = 2        # r4
num_workers = 0    # r4 (required by the clean trainer contract)
seed = 101         # r4
omp = 2            # r4
out_dir = "runs/active/c4_wm"
