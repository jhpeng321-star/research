# LOOP14 WM fine-tune (phase 3 of a Dreamer-loop cycle; LOOP14_DESIGN.md).  Continues the
# CURRENT ACCEPTED WM (model.init_from is set by scripts/c4/loop14.py, never here) with the
# 13E/R14 stage-B recipe, except:
#   * the IDM/MOBIL core, driver encoder/updater, lane nets, merge core/pivot, gates and the
#     emergency / secure-gap physics stay FROZEN; trainable = residual (non-lane), follower
#     courtesy and the learned merge yield (R13Y scalars, stage-A lr scale);
#   * courtesy is NOT fresh-zeroed (a continuation, not a new stage B);
#   * R14 D1 lane_change_secure_gap ON (first loop update) and R14 D3 low-share sources +
#     low_share_oversample 1.69 (unchanged);
#   * the collected policy/native pairs (WMS_DATA_LOOP14_PAIRS) join the TRAIN mix at 0.15,
#     every original share scaled by 0.85.  pairs300 stays THE paired source of the existing
#     loss.paired_diff (one paired source only); R15's paired action-difference loss is merged
#     separately and then switches loop14_pairs to paired = true (LOOP14_DESIGN.md);
#   * a short single 120 s stage (40 steps).
schema_version = 2
name = "WM-S-C4-LOOP14-FT"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true
checkpoint_forward = true
merge_negotiation = false
driver_param_mode = "physical"
driver_param_init = "checkpoint"
residual_accel_reinit = false
temporal_accel_off = true
residual_accel_off = false
follower_courtesy_off = false
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false
follower_courtesy_version = 2
follower_courtesy_init_zero = false
follower_courtesy_state_grad = true
follower_courtesy_intent = "pivot"
# R13Y learned yield: trainable in the loop fine-tune (owner 2026-10-25: residual/courtesy/yield).
mainline_merge_yield_learnable = true

[physics]
emergency_braking = true
secure_gap_veto = true
# R14 D1: HDV mainline lane changes need the same learned-parameter gs.
lane_change_secure_gap = true
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

# Original R14 TRAIN mix (D3 shares, R14_DESIGN.md) x 0.85 + the collected loop pairs 0.15.
# data.c4_sources REPLACES the parent list; c4_base native_v5 = 1 - the others (validated).

[[data.c4_sources]]
name = "native_v5"
path = "v5_native"          # WMS_DATA_V5_NATIVE
mix_ratio = 0.39899       # 0.4694 x 0.85
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "lowpen_native"
path = "lowpen_native"          # WMS_DATA_LOWPEN_NATIVE
mix_ratio = 0.02601       # 0.0306 x 0.85
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_plain"
path = "genrand_plain"          # WMS_DATA_GENRAND_PLAIN
mix_ratio = 0.20247       # 0.2382 x 0.85
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "lowpen_genrand_plain"
path = "lowpen_genrand_plain"          # WMS_DATA_LOWPEN_GENRAND_PLAIN
mix_ratio = 0.01003       # 0.0118 x 0.85
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_branch"
path = "genrand_branch"          # WMS_DATA_GENRAND_BRANCH
mix_ratio = 0.07004       # 0.0824 x 0.85
window_stride_s = 10.0
use_val = true
paired = false

[[data.c4_sources]]
name = "lowpen_genrand_branch"
path = "lowpen_genrand_branch"          # WMS_DATA_LOWPEN_GENRAND_BRANCH
mix_ratio = 0.01496       # 0.0176 x 0.85
window_stride_s = 10.0
use_val = true
paired = false

[[data.c4_sources]]
name = "pairs300"
path = "pairs300"          # WMS_DATA_PAIRS300
mix_ratio = 0.1275       # 0.15 x 0.85
window_stride_s = 10.0
use_val = true
paired = true

[[data.c4_sources]]
name = "loop14_pairs"
path = "loop14_pairs"      # WMS_DATA_LOOP14_PAIRS: this cycle's converted policy/native pairs
mix_ratio = 0.15
window_stride_s = 10.0
use_val = true
paired = false              # R15 merge: true (and pairs300 false) - see LOOP14_DESIGN.md

# R14 D3 low-share replay weight, unchanged.
[data.replay]
low_share_oversample = 1.69
low_share_max = 0.15
low_share_min_stage_s = 120.0

[loss]
recorded_replay_present = "filled"

[loss.merge_core]
version = 2
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.cutin_reaction]
weight = 0.0

[loss.driver_prior]
weight = 0.0

[loss.follower_courtesy]
weight = 9.067
huber_delta_mps2 = 1.0
contrast = true
absolute_weight = 4.525

[curriculum]
unroll_s = [120.0]
stage_steps = [40]
truncation_steps_per_stage = [120]
max_hours = 1.5

[optim]
lr_per_stage = [3.0e-5]
batch_size_per_stage = [4]
# Core FROZEN (driver encoder/updater, gates, lane nets, merge core/pivot, residual lane head,
# temporal); merge_yield is NOT frozen here (residual / courtesy / yield are trained).
freeze_prefixes = [
  "driver_encoder", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net.lane", "temporal",
]

[optim.lr_scale]
"residual_net" = 0.5
"follower_courtesy" = 1000.0
"merge_yield" = 1000.0

[selection]
val_max_windows = 16

[runtime]
out_dir = "runs/c4_wm_loop14_ft"
