# V10 loop WM fine-tune for iterations k >= 1 (2026-10-19).  = c4_wm_v5m_refresh.toml (native 0.45 / genrand_plain
# 0.25 / v6_policy = this iteration's converted policy pool 0.25 / genrand_branch 0.05) + a 240 s stage so the A5
# aggregate delay loss (120-300 s window) is ACTIVE every iteration (owner rule), step checkpointing, small
# per-stage batches, no loss-share probe (gpuR OOM).  lane_learnable / mainline_lane_mode / lane_flow / horizon
# replay keys / agg_delay keys come from the loop's --set lists.
schema_version = 2
name = "WM-S-C4-V10LOOP-K"
extends = "c4_wm_v5m_refresh.toml"

[model]
checkpoint_step = true
courtesy_inputs = true   # 10-20 learned courtesy (zero-init)

[curriculum]
unroll_s = [60.0, 120.0, 240.0]
stage_steps = [60, 40, 30]
truncation_steps_per_stage = [120, 120, 60]
max_hours = 3.0

[optim]
lr_per_stage = [5.0e-5, 3.0e-5, 2.0e-5]
batch_size_per_stage = [8, 4, 2]

[loss]
loss_share_logging = false
courtesy_weight = 3.0
brake_follow_weight = 2.0

[data.replay]
brake_oversample = 2.0

[runtime]
out_dir = "runs/active/c4_wm_v10loop_k"
