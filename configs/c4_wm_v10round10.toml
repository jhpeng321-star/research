# V10 round 10 (2026-10-22): ROUND 9 + ONE change = fix B, recorded cut-in reaction supervision.
# Everything not listed under "fix B" below is byte-identical to configs/c4_wm_v10round9.toml (the effective
# config differs from round 9 only in: name, model.init_from, loss.cutin_reaction.*, optim.freeze_prefixes,
# optim.lr_scale, runtime.out_dir, model.merge_pivot_state_st (owner-required final-round-9 setting)
# -- enforced by tests/test_r10_config.py). Extends round 2 directly with
# round 9's blocks copied inline: the loader caps the extends chain at 16 files and round 9 already uses 16.
#
# Evidence (tmp_r10 attribution, see R10_PREP.md): at matched recorded state the WM lane-1 follower's
# post-insertion minimum acceleration is below the recorded one by the IDM core (part) and the gated
# learned residual (attention head + temporal emission, the larger part); the loss below supervises the
# total predicted acceleration, and only the learned emitters (plus the gate scalars, see R10_PREP.md)
# train.  Round 9's fitted merge_pivot is FROZEN (bitwise) so the merge result of round 9 stays attributable.
schema_version = 2
name = "WM-S-C4-V10ROUND10"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true # Keep the pathwise adjoint, including through frozen merge-pivot dynamics.
merge_negotiation = false
# Round 9 final checkpoint (gate and driver pass --set model.init_from=... as in round 9).
init_from = "/root/autodl-tmp/c4/v5/runs/c4_wm_v10_round9/wm_s_stage300.pt"

[physics]
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[loss.merge_core]
version = 2
weight = 0.4
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

# FIX B (the only new loss): teacher-forced Huber on the lane-1 follower's recorded acceleration after each
# recorded ramp->lane-1 insertion (event windows end at the first non-negative recorded acceleration, max 6 s,
# 1 s pre-context), anchored by ordinary lane-1 HDV transitions (control_weight relative).  weight = the
# gradient-norm parity weight of R10_PREP.md (tools/r10_weight_rule.py).
[loss.cutin_reaction]
weight = 1.0
control_weight = 1.0
pre_s = 1.0
max_window_s = 6.0
huber_delta_mps2 = 0.5

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [30, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]
# Trainable: ONLY the learned acceleration emitters that carry the over-reaction: the temporal MLP and the two
# gate scalars (gate_g_max_logit, gate_tau_raw) that set how much of the learned residual enters.  The residual
# attention head (residual_net.accel) is frozen: at the round-8 stage-300 checkpoint its pre-tanh activation is
# about -25 on every row, i.e. a dead constant -1.5 m/s^2 before the gate with exactly zero gradient, so no loss
# can move it (R10_PREP.md).  Frozen bitwise: the merge pivot (round 9's fit), driver encoder/updater, lane
# gates, lane network, history/step embeddings, the whole residual net, the merge core.
freeze_prefixes = [
  "driver_encoder", "driver_updater", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net",
]

[optim.lr_scale]
"temporal" = 5.0      # pilot rule: largest scale in {1,5,20,100} whose held-out post-insertion min-accel deficit is not worse than baseline by > 0.01 m/s^2 (20x and 100x worsen it)
"gate_" = 100.0       # two raw scalars: Adam moves a scalar <= lr per step, so 100x (rounds 7b/8 convention for scalars)

[selection]
val_max_windows = 256

[runtime]
out_dir = "runs/active/c4_wm_v10_round10"
