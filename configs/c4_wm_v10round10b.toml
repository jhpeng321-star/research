# V10 round 10b (2026-10-23): ROUND 10 (= round 9 + fix B, cut-in reaction supervision) + the LEARNED pre-merge
# follower courtesy (owner-approved option A, R10B_DESIGN.md).  One follower round on top of round 9.
# Everything except the R10B blocks below is byte-identical to configs/c4_wm_v10round10.toml; the effective config
# differs from round 10 only in: name, model.follower_courtesy*, loss.follower_courtesy.*, optim.lr_scale
# (+ "follower_courtesy"), runtime.out_dir -- enforced by tests/test_r10b_courtesy.py.  Extends round 2 directly with
# round 10's blocks copied inline: the loader caps the extends chain at 16 files and round 10 already uses 16.
#
# R10B evidence (R9_YIELD.md): in SUMO only the target lane-1 follower of a waiting ramp car slows before the merge
# (matched excess -0.40 to -0.51 m/s^2, onset ~6 s before, situational, no driver dependence); rounds 8/9 show none.
# The courtesy head adds one learned, unbounded acceleration offset to the target follower (pair by geometry, smooth
# inputs, zero last layer), trained ONLY by the recorded-state courtesy loss; merge_pivot stays frozen.
schema_version = 2
name = "WM-S-C4-V10ROUND10B"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true    # full pathwise adjoint kept (owner decision 10-22), as in round 9
checkpoint_forward = true      # recompute the pure per-step forward in backward (exact; as in round 9)
merge_negotiation = false
# R10B: learned pre-merge follower courtesy head (default off elsewhere; zero last layer = exact no-op at init).
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false     # per-driver input: ablation only (R9_YIELD section 4: no driver signal)
follower_courtesy_rollout_grad = false  # head weights trained ONLY by loss.follower_courtesy (state adjoint kept)
# Round 9 final checkpoint (gate and driver pass --set model.init_from=... as in round 9).
init_from = "/root/autodl-tmp/c4/v5/runs/c4_wm_v10_round9/wm_s_stage300.pt"

[physics]
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[loss.merge_core]
version = 2
# Owner amendment (as round 9): TF + F2 only; recorded-matched on-policy scores are diagnostics.
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

# FIX B (the only new loss): teacher-forced Huber on the lane-1 follower's recorded acceleration after each
# recorded ramp->lane-1 insertion (event windows end at the first non-negative recorded acceleration, max 6 s,
# 1 s pre-context), anchored by ordinary lane-1 HDV transitions (control_weight relative).  weight = the
# gradient-norm parity weight of R10_PREP.md (tools/r10_weight_rule.py, measured 2026-10-23, docs/r10_weight_rule.json).
[loss.cutin_reaction]
weight = 2.174
control_weight = 1.0
pre_s = 1.0
max_window_s = 6.0
huber_delta_mps2 = 0.5

# R10B (the only other new loss): teacher-forced recorded acceleration of lane-1 HDV followers that have a ramp partner
# (prediction = detached no-courtesy model acceleration + courtesy offset, plant clamp; trains only the head).
# weight = gradient-norm parity with the weighted fix-B term (docs/r10b_weight_rule.json, tools/r10b_courtesy_offline.py).
[loss.follower_courtesy]
weight = 1.0
huber_delta_mps2 = 1.0

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [30, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]
# Trainable: ONLY the learned acceleration emitters that carry the over-reaction: the temporal MLP and the two
# gate scalars (gate_g_max_logit, gate_tau_raw) that set how much of the learned residual enters.  The residual
# attention head (residual_net.accel) is frozen: at the round-8 stage-300 checkpoint its pre-tanh activation is
# about -25 on every row, i.e. a dead constant -1.5 m/s^2 before the gate with exactly zero gradient, so no loss
# can move it (R10_PREP.md).  Frozen bitwise: the merge pivot (round 9's fit), driver encoder/updater, lane
# gates, lane network, history/step embeddings, the whole residual net, the merge core.
freeze_prefixes = [
  "driver_encoder", "driver_updater", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net",
]

[optim.lr_scale]
"temporal" = 5.0      # pilot rule: largest scale in {1,5,20,100} whose held-out post-insertion min-accel deficit is not worse than baseline by > 0.01 m/s^2 (20x and 100x worsen it)
"gate_" = 100.0       # two raw scalars: Adam moves a scalar <= lr per step, so 100x (rounds 7b/8 convention for scalars)
"follower_courtesy" = 100.0   # R10B fresh zero-init head: offline lr pilot rule (docs/r10b_weight_rule.json)

[selection]
val_max_windows = 256

[runtime]
out_dir = "runs/active/c4_wm_v10_round10b"
