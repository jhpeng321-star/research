# V10 round 12C (2026-10-24, S-R12C): PHYSICS-ONLY CORE CALIBRATION of round 12.  Round 12 stopped
# mid-run (BASE checks rejected: braking bias worse, free-road bias worse) with the learned emissions
# compensating for a mis-calibrated IDM core (encoded accel p50 1.52 vs decel p50 3.14; offline
# physics-only fit a 0.87, b 2.02, T 1.11, s0 2.08, BASE_FOLLOWER_DIAG.md).  Round 12C trains ONLY the
# driver encoder (physical mode) + the shared IDM/MOBIL physics parameters with EVERY learned
# acceleration emission disabled, to test whether the IDM core calibrates when residuals cannot
# compensate (BRAKE_DIAG's 'physics only (residual and courtesy off)' arm as a training run):
#   (1) model.temporal_accel_off = true (R13F switch: the temporal acceleration emission is an exact 0),
#   (2) model.residual_accel_off = true (R12C switch: the residual attention/accel emission is an exact 0),
#   (3) model.follower_courtesy_off = true (R12C switch: the courtesy offset is an exact 0).
# Trainable set = driver_encoder.head + driver_encoder.centre_logits ONLY (the shared physical centre
# and the per-driver deviations); residual_net, temporal and follower_courtesy join the freeze list.
# The residual acceleration read-out stays at its round-12 re-initialised exact 0 and the zero-init
# courtesy head stays exactly 0 (both frozen).  Init, losses, merge pivot frozen, lr rule = round 12;
# driver prior OFF (the round-12 launch choice, passed by the gate).  Diagnostic schedule: a single
# 120 s stage, 30 steps, batch 4, selection.val_max_windows 4, max_hours 2.5.  Every new switch
# defaults off with bit-identity vs 1878f842 (tests/test_r12c_physics_only.py).
# ---- round 12 header follows ----
# V10 round 12 (2026-10-24): ROUND 9 (A-only hybrid first-passage merge law, frozen) + the BASE CALIBRATION of
# BASE_FOLLOWER_DIAG.md + the round-11 contrast courtesy head, fix B DROPPED (round 10 showed it leaves the cause
# untouched and degraded ranking/stuck; R12_DESIGN.md section 1).  The car-following path is retrained on the full
# round-8/9 motion objective (position/speed, aggregate, agg_delay incl. the paired 300 s delay term, paired_diff,
# brake persistence, lane event/flow guards, residual magnitude, textbook driver prior) with merge_pivot FROZEN.
#   (A) model.driver_param_mode = "physical" (V6ENC: a 0.3-4.0, b 0.8-6.0, T 0.4-3.0, s0 0.5-5.0, v0 0.6-1.4 x limit;
#       learned shared centre; prediction error only) + model.driver_param_init = "centre" (head rows of the five
#       longitudinal means zeroed after loading: every driver starts at the learned centre = physics defaults).
#   (B) model.residual_accel_reinit = true (the dead tanh-saturated residual acceleration read-out restarts at 0).
#   (C) round-11 contrast courtesy v2, zero-init head (R11_REVIEW C2 launch choice), weight/lr of the R11 zero-init rule.
#   (D) loss.recorded_replay_present = "filled" (replay state = filled window presence; loss_valid = supervision only).
# Every new switch defaults to the round-11 behaviour elsewhere (tests/test_r12_base.py).  Extends round 2 directly
# (16-file extends cap), blocks copied inline from round 9 / round 11.
schema_version = 2
name = "WM-S-C4-V10ROUND12C"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true    # full pathwise adjoint kept (owner decision 10-22), as in round 9
checkpoint_forward = true      # recompute the pure per-step forward in backward (exact; as in round 9)
merge_negotiation = false
# (A) reachable IDM settings (V6ENC) and the centre start
driver_param_mode = "physical"
driver_param_init = "centre"
# (B) dead residual acceleration head re-initialised
residual_accel_reinit = true
# (C) round-11 learned follower courtesy (contrast target, version-2 inputs, fresh zero head)
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false  # head weights trained ONLY by loss.follower_courtesy (state adjoint kept)
follower_courtesy_version = 2
follower_courtesy_init_zero = true
# (1) R13F: temporal acceleration emission disabled (exact 0; lane rows unchanged)
temporal_accel_off = true
# (2)+(3) R12C physics-only core calibration: residual attention/accel emission and courtesy offset exact 0
residual_accel_off = true
follower_courtesy_off = true
# Round 9 final checkpoint (gate passes --set model.init_from=$R12C_INIT) = round 12's init.
init_from = "/root/autodl-tmp/c4/v5/runs/c4_wm_v10_round9/wm_s_stage300.pt"

[physics]
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[loss]
recorded_replay_present = "filled"   # (D) fix of the replay visibility mask

[loss.merge_core]
version = 2
# Owner amendment (as round 9): TF + F2 only; recorded-matched on-policy scores are diagnostics.
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

# Fix B is dropped (weight 0 = the term is never built).  The courtesy contrast keeps its own no-grad replay.
[loss.cutin_reaction]
weight = 0.0

# Same as round 12 (the head is frozen by the freeze list; the term trains nothing, kept for identical losses).
[loss.follower_courtesy]
weight = 9.067   # R11 zero-init rule value (docs/r11_weight_rule.json; R12_DESIGN.md section 4)
huber_delta_mps2 = 1.0
contrast = true

# Diagnostic schedule (R12C): a single 120 s stage, 30 steps, batch 4 as round 12's stage 1.
[curriculum]
unroll_s = [120.0]
stage_steps = [30]
truncation_steps_per_stage = [120]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5]
batch_size_per_stage = [4]
# Trainable = ONLY the driver encoder settings head + the learned shared physical centre (the shared IDM
# parameters and the per-driver deviations incl. the MOBIL lane rows 5..8).  Everything else frozen
# bitwise: the residual net (whole, incl. its lane read-out; its acceleration row stays at the round-12
# re-initialised exact 0), the temporal MLP, the courtesy head (stays at its zero init), the merge pivot
# (round 9's fit), merge core, the two residual GATE scalars, the driver-encoder trunk (the driver
# EMBEDDING fed to lane_v5 / residual is unchanged), driver updater, lane network and gates,
# history/step embeddings.
freeze_prefixes = [
  "driver_encoder.history_proj", "driver_encoder.query", "driver_encoder.interaction_proj",
  "driver_encoder.history_gru", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net", "temporal", "follower_courtesy",
]

[optim.lr_scale]
"driver_encoder.head" = 10.0          # R12 lr rule (docs/r12_lr_rule.json): best held-out of {1,10} x {10..1000}
"driver_encoder.centre_logits" = 1000.0  # R12 lr rule (docs/r12_lr_rule.json)

[selection]
val_max_windows = 4

[runtime]
out_dir = "runs/active/c4_wm_v10_round12c"
