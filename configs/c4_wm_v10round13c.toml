# S-R13C: calibrated S-R12C core loaded as-is, frozen; residual + repair-A courtesy only.
# Round-12 objective inline (extends depth cap); owner budget 40 + 60 steps.
schema_version = 2
name = "WM-S-C4-V10ROUND13C"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true
checkpoint_forward = true
merge_negotiation = false
driver_param_mode = "physical"
driver_param_init = "checkpoint"
residual_accel_reinit = false
temporal_accel_off = true
residual_accel_off = false
follower_courtesy_off = false
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false
follower_courtesy_version = 2
follower_courtesy_init_zero = true
follower_courtesy_state_grad = true
follower_courtesy_intent = "pivot"
init_from = "/root/autodl-tmp/c4/v5/runs/c4_wm_v10_round12c/wm_s.pt"

[physics]
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[loss]
recorded_replay_present = "filled"

[loss.merge_core]
version = 2
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.cutin_reaction]
weight = 0.0

[loss.driver_prior]
weight = 0.0

[loss.follower_courtesy]
weight = 9.067
huber_delta_mps2 = 1.0
contrast = true
absolute_weight = 4.525

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [40, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 8.0

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]
# Inverse of S-R12C's trainable set, retaining R12's other freezes.
# Physics is represented by driver_encoder.centre_logits + its settings head;
# the plant PhysicsConfig is immutable configuration, not optimizer parameters.
freeze_prefixes = [
  "driver_encoder", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net.lane", "temporal",
]

[optim.lr_scale]
"residual_net" = 0.5
"follower_courtesy" = 1000.0

[selection]
val_max_windows = 16

[runtime]
out_dir = "runs/active/c4_wm_v10_round13c"
