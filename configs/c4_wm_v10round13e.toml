# S-R13E stage A: conservative emergency-braking core calibration.
# R12C is already at the 16-file cap: its recipe is inlined over round 2.
# No init transformations:
# S-R12C FINAL weights, including frozen emission networks, transfer as-is.
schema_version = 2
name = "WM-S-C4-V10ROUND13E"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true
checkpoint_forward = true
merge_negotiation = false
driver_param_mode = "physical"
init_from = "runs/c4_wm_v10_round12c/wm_s.pt"
driver_param_init = "checkpoint"
residual_accel_reinit = false
follower_courtesy_init_zero = false
temporal_accel_off = true
residual_accel_off = true
follower_courtesy_off = true
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false
follower_courtesy_version = 2

[physics]
emergency_braking = true
secure_gap_veto = true
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[loss]
recorded_replay_present = "filled"

[loss.merge_core]
version = 2
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.cutin_reaction]
weight = 0.0

# Prediction-error calibration only. Weight zero avoids building either term;
# in particular, the frozen courtesy network needs no additional replay forward.
[loss.driver_prior]
weight = 0.0

[loss.follower_courtesy]
weight = 0.0
huber_delta_mps2 = 1.0
contrast = false  # no contrast objective when the courtesy term is disabled

[curriculum]
unroll_s = [120.0]
stage_steps = [30]
truncation_steps_per_stage = [120]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5]
batch_size_per_stage = [4]
freeze_prefixes = [
  "driver_encoder.history_proj", "driver_encoder.query", "driver_encoder.interaction_proj",
  "driver_encoder.history_gru", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net", "temporal", "follower_courtesy",
]

[optim.lr_scale]
"driver_encoder.head" = 10.0
"driver_encoder.centre_logits" = 1000.0

[selection]
val_max_windows = 4

[runtime]
out_dir = "runs/c4_wm_v10_round13e_a"
