# V10 round 6 (2026-10-20 night): round 5b (merge redesign; init set by the coordinator) + STRUCTURAL braking fix
# (V10SLOWRES: learned slow temporal residual state, tau init 0.5 s, tau head conditioned on IDM accel / gap / closing speed)
# + free-rollout onset-statistics auxiliary (astra BRAKE_REDESIGN_ADVICE #1 + #3). brake_wave stays OFF (no effect, cost ranking).
# Keys of round 5 are inlined (extends-depth limit) with round-5b overrides (brake_wave 0, post_merge 0.5/0.5).
# ranking checks hold) else round 2 (set by the coordinator via model.init_from). Adds:
#           on-policy integrated censored first-passage loss (replaces merge_timing / merge_survival for the merge head);
schema_version = 2
name = "WM-S-C4-V10ROUND6"
extends = "c4_wm_v10round2.toml"

[model]
merge_negotiation = true
merge_decision = "threshold"
lane_v5_extra_features = true
residual_head_rescale = true
temporal_residual_mode = "slow"
temporal_tau_init_s = 0.5
temporal_tau_conditioned = true

[loss.merge_first_passage]
weight = 1.0
rank_weight = 0.5
metrics = true

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.merge_yield]
yield_huber = 0.4
ramp_adapt_huber = 0.2
safety_bce = 0.2

[loss.brake_wave]
weight = 0.0
residual_weight = 0.0
spurious_weight = 0.0

[loss.post_merge]
weight = 0.5
residual_weight = 0.5
window_s = 10.0
huber_delta_mps2 = 0.5

[loss.onset_stats]
weight = 1.0

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [30, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 2.5
merge_teacher_frac_schedule = [0.25, 0.0]

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]

[optim.lr_scale]
"driver_encoder" = 0.3
"driver_updater" = 0.3
"residual_net" = 0.5
"k_embedding" = 0.5
"history_proj" = 0.5

[selection]
val_max_windows = 256   # cap validation windows (eval batch 4 made round-5b validation ~75 min)

[runtime]
out_dir = "runs/active/c4_wm_v10_round6"
