# V10 round 6c (2026-10-21 ~01:20, owner OK): merge decision v2 = hazard with a persistent per-driver frailty latent
# (V10FRAILTY) + the R5 extra merge inputs, on the paired-ranking anchor (round 2 stage240). Keeps the GPU busy while the
# learned LC2013-like merge core is built; a tested merge alternative by morning. No negotiation / yield / braking terms
# (attribution). First-passage compatibility tolerances as in round 5b (pos 50 m / speed 8 / gap 40 / gap-speed 8).
schema_version = 2
name = "WM-S-C4-V10ROUND6C"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "frailty"
lane_v5_extra_features = true

[loss.merge_frailty]
weight = 1.0
n_quad = 8
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [30, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]

[selection]
val_max_windows = 256

[runtime]
out_dir = "runs/active/c4_wm_v10_round6c"
