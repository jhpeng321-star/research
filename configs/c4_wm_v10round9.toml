# R9 A-only hybrid first-passage DRAFT. Extends round2 directly to respect loader depth.
# Init is supplied by tools/launch_round9.py from a workspace round8 stage300.
# Learned width initialization and tau shrinkage are provisional inner-validation candidates.
schema_version = 2
name = "WM-S-C4-V10ROUND9"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0          # Learned positive passage width initialization.
merge_quadrature_order = 32
merge_pivot_state_st = true    # full pathwise adjoint kept (owner decision 10-22); memory handled by checkpoint_forward
checkpoint_forward = true      # recompute the pure per-step forward in backward (exact; bit-identical grads, ~30x less memory)
merge_negotiation = false

[physics]
merge_end_wait = false
# R9LANE (owner-approved 2026-10-22): SUMO never moves a ramp-lane car past its lane end
# (merge_zone_s1_m); code default stays false.
ramp_lane_end_stop = true
# R9LANE2: a started risk chain survives a zone-start flicker of a crawling queue head.
ramp_risk_retain = true

[loss.merge_core]
version = 2
# Owner amendment: TF + F2 only; recorded-matched on-policy scores are diagnostics.
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [30, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]
# Freeze untouched dynamics and all legacy tensors initially. The eight new
# boundary/tau/width parameters are the entire optimizer membership.
freeze_prefixes = [
  "driver_encoder", "driver_updater", "gate_", "lane_gate_", "history_proj",
  "k_embedding", "lane_v5", "merge_core", "residual_net", "temporal",
]

[optim.lr_scale]
"merge_pivot" = 20.0

[selection]
val_max_windows = 256

[runtime]
out_dir = "runs/active/c4_wm_v10_round9"
