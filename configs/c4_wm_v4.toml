# WM-S-C4 v4 (2026-10-13): configs/c4_wm_v3.toml + the JUNCTIONFIX data convention.
#   data.junction_fix = "ffill": junction-transit rows of the pack windows (pack_v3, pack_dspeed,
#   pack_switching_train) keep the vehicle's previous lane (forward fill; for a vehicle on a
#   junction at t0 from its last on-lane pre-t0 row) and an s interpolated between the
#   bracketing on-lane rows, instead of a lane-0 row with a frozen s; the transit step stays
#   loss-excluded (as in evaluation).  CAV teacher and the aggregate recorded lane use the
#   filled lane.  See JUNCTIONFIX_NOTES.md / src/wms/data/junction_fix.py.
# Everything else is v3 unchanged (one change at a time).
schema_version = 2
name = "WM-S-C4-V4"
extends = "c4_wm_v3.toml"

[data]
junction_fix = "ffill"

[runtime]
out_dir = "runs/active/c4_wm_v4"
