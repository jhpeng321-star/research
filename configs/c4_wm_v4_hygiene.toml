# WM-S-C4 v4 HYGIENE (2026-10-14): configs/c4_wm_v3.toml + two data-side switches, nothing else.
#   data.junction_fix = "ffill"        JUNCTIONFIX (commit e40ee87, JUNCTIONFIX_NOTES.md).
#   data.controller_hygiene = "strict" DATAHYG (DATAHYG_NOTES.md): design rule "no designed
#     controllers in the WM training data" - direct-mix windows with a CIRCLES-damping CAV are
#     dropped (this removes 99.7 % of them at the 120 s window, so the switching source is left
#     out entirely; see the notes), dspeed windows may not overlap a merge_aimed / gap_opening
#     segment, dspeed CAVs are labelled direct only while actually directed (commands unknown).
schema_version = 2
name = "WM-S-C4-V4-HYGIENE"
extends = "c4_wm_v3.toml"

[data]
junction_fix = "ffill"
controller_hygiene = "strict"

[runtime]
out_dir = "runs/active/c4_wm_v4_hygiene"
