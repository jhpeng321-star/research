# WM-S-C4 v4-lane (2026-10-14, LANEFIX_NOTES.md): configs/c4_wm_v3.toml + the lane-change fixes
# of the 2026-10-13/14 lane diagnosis (runs/scratch/lanediag):
#   1. model.lane_decision = "sample": rollout lane decisions are drawn from the masked hazard
#      categorical (seeded; evaluation / validation / imagination fix the draws) instead of the
#      argmax that made every discretionary change (p << 0.5) impossible in rollouts.
#   2. loss.lane_hazard_decouple = true: the rollout lane CE and the flip-rate guard no longer
#      reach the hazard (it chased the recorded lane after missed changes -> over-confident,
#      mis-ranked); the teacher-forced loss.lane_event CE is its only objective ...
#   3. ... with weight 3 (it now carries the whole hazard gradient) and the v2 ranking features
#      (lookahead speed vs v0, leader trend, density ahead, time blocked behind a slower leader).
#   4. model.merge_hazard_zone = "full": the hazard owns ramp merges from the start of the
#      acceleration lane (physics forces only the last 5 m); model.gap_stopped_relax = true:
#      stopped ramp mergers need 0.5 m clearances (no anticipation; follower stopping term kept).
# Everything else is v3 unchanged.  NOT trained yet.
schema_version = 2
name = "WM-S-C4-V4LANE"
extends = "c4_wm_v3.toml"

[model]
lane_decision = "sample"
lane_hazard_features = "v2"
merge_hazard_zone = "full"
gap_stopped_relax = true

[loss]
lane_hazard_decouple = true

[loss.lane_event]
weight = 3.0

[runtime]
out_dir = "runs/active/c4_wm_v4_lane"
