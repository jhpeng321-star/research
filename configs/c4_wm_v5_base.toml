# WM-S-C4 v5 BASE (2026-10-14, INFRAV5_NOTES.md): configs/c4_wm_v4.toml + the non-lane v5
# fixes of the v4 diagnoses (runs/scratch/MORNING_WM_DIAG_NOTES.md "v4 speed bias root
# cause" / "v4 stage-30 diagnosis"; runs/scratch/v4speed).  From scratch.  NOT trained yet.
#   sched    stage_steps [1200, 900, 800, 250] (30 s stage 1500 -> 900: it created the residual
#            overshoot; 60 s 400 -> 800, 120 s 160 -> 250), mixed_horizon_frac 0.3 -> 0,
#            lr_per_stage [1e-3, 3e-4, 3e-4, 1e-4] (60 s stage 1e-4 -> 3e-4),
#            val_max_windows 512 (fixed evenly spaced subset, 32 batches per horizon).
#   select   curriculum.selection = "multi_horizon_v2": candidates compared on ONE horizon set;
#            the best + last validation of every eligible stage (>= 60 s) are completed on
#            10/30/60/120 s at the end of the run (missing horizons re-validated on the same
#            subset); 120 s normalised by the best candidate, never by the run's own first
#            validation (v4 picked its 60 s-stage step-200 checkpoint over the final one).
#   data     data.jam.oversample 2.0 (jam windows 2x within every source incl. the C4/GENRAND
#            sources; source shares and paired batches unchanged); genrand_plain mix_ratio
#            0.30 -> 0.15 (branches unchanged: paired batches + 0.05 ordinary windows).
#   loss     loss.residual.residual_mag_weight 0.01 -> 0.05 (residual overshoots the physics
#            core's free-flow lag); loss.driver_prior.weight 0 (= off; pending decision:
#            population anchor of the encoded driver settings, see INFRAV5_NOTES.md; target
#            "legacy" = medians of the population the v5 data were simulated with; switch to
#            "textbook" only for data from the c4/popfix textbook population).
#            loss.paired_diff weight 0.5 -> 2.0, fraction 0.20 -> 0.25 (
#            "v4 ~2 % of the logged loss; target ~10 % on paired batches").  CHECK THE PREMISE:
#            v4's train_log gives paired_value_share 8.5 / 9.2 / 9.4 % ON PAIRED BATCHES at the
#            10 / 30 / 60 s stages (the ~2 % is the all-batch mean, 20 % paired).  Weight 2.0
#            therefore gives ~28 % on paired batches (~7 % of all batches); the CPU smoke's
#            untrained paired batch: 25-32 % at 2.0 vs 8.5-11 % at 0.5.  For ~10 % on paired
#            batches keep weight ~0.5-0.6.
#   Lanes: unchanged from v4 (the lane model is rebuilt separately on c4/lanev5).
#
# WALL-TIME ESTIMATE, the GPU host (RTX 4080S vGPU, CPU-bound loop), batch 16, from the measured v4 /
# v4_cont step times (train_log.jsonl, pure-horizon steps): 2.45 / 7.31 / 15.0 / 34.7 s.
#     10 s : 1200 x  2.45 =  2940 s
#     30 s :  900 x  7.31 =  6580 s
#     60 s :  800 x 15.0  = 12000 s
#     120 s:  250 x 34.7  =  8680 s
#     training ~30200 s = 8.4 h
#   Validation (val_every 200 + stage ends, 32 batches per horizon, forward-only ~0.4 x a train
#   step; v4_cont overhead check: ~2100 s for its 3 events + startup):
#     events 6 / 5 / 5 / 2 per stage = 190 + 625 + 1585 + 1520 s, final re-validation of the two
#     60 s-stage candidates at 120 s ~890 s, startup ~600 s  -> ~5400 s = 1.5 h
#   TOTAL ~9.9 h  > 9 h target.  Proposed cuts (not applied here):
#     [selection] val_every 200 -> 400                     (-0.5 h)
#     stage_steps[2] 800 -> 650 (60 s stage)               (-0.6 h)  -> ~8.8 h
#     (or stage_steps[3] 250 -> 200, -0.5 h, if the 120 s horizon matters less)
#   max_hours 10.5 so the box does not stop the run before the end-of-run selection.
schema_version = 2
name = "WM-S-C4-V5BASE"
extends = "c4_wm_v4.toml"

[data.jam]
oversample = 2.0
# INFRAV5 finding: with the legacy jam rule (min_fraction 0 = any HDV observation < 5 m/s) ~97 %
# of the native TRAIN windows are "jam" windows, so oversample 2.0 moves the jam share only
# 96.8 % -> 98.4 % (local packs + GENRAND smoke).  min_fraction = 0.3 (jam =
# > 30 % of the window's HDV observations below 5 m/s; 53.5 % of native windows -> 69.7 % of
# native draws, all ordinary draws 57.8 % -> 70.8 % on the local data) makes it act.
min_fraction = 0.3          # ON

[[data.c4_sources]]
name = "genrand_plain"
path = "genrand_plain"     # WMS_DATA_GENRAND_PLAIN
mix_ratio = 0.15
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_branch"
path = "genrand_branch"    # WMS_DATA_GENRAND_BRANCH
mix_ratio = 0.05
window_stride_s = 10.0
use_val = true
paired = true

[loss.residual]
residual_mag_weight = 0.05

[loss.driver_prior]
weight = 0.0               # e.g. 0.05 turns the population anchor on
target = "legacy"          # medians of the legacy SUMO population (= the v5 training data)

[loss.paired_diff]
# premise corrected (v4 was ~9 % on paired batches, ranking still failed);
# 1.0 ~ doubles it (~15-18 % on paired batches) without letting it dominate per-step accuracy.
weight = 1.0
fraction = 0.25

[curriculum]
stage_steps = [1200, 900, 650, 250]   # 60 s 800 -> 650 (wall time)
selection = "multi_horizon_v2"
mixed_horizon_frac = 0.0
max_hours = 10.5

[optim]
lr_per_stage = [1.0e-3, 3.0e-4, 3.0e-4, 1.0e-4]

[selection]
val_max_windows = 512
val_every = 400            # 200 -> 400 (wall time, ~8.8 h total)

[runtime]
out_dir = "runs/active/c4_wm_v5_base"
