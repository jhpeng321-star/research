# V7FT (owner-approved 2026-10-17): v5m fine-tune with the merge-zone calibration loss.
# Diagnosis (docs/C4_DIAGNOSIS_20261016.md, runs/active/C4-DIAG-20261016/README.md): rolled 120 s with CAVs
# teacher-forced, v5m is too congested at the merge (HDV merge-zone speed 1-3.7 m/s low, discharge past
# s = 75.44 m 5-8 % low).  loss.merge scores exactly those (wms.train.losses.merge).
# init_from = the v5m checkpoint, set at launch: --set model.init_from=<abs path>.
#
# loss.merge weights (no real training data on the authoring host, so not measured on a real batch):
# expected start values from the diagnosis biases: merge_speed ~ 10 x Huber(1-3 m/s / 1 m/s) ~ 10;
# merge_discharge ~ 20 x mean_t Huber(E_t / 2 veh) with a 3-4 veh deficit at 120 s ~ 3 (60 s) - 9 (120 s);
# together ~ 10-15 % of the position loss (~80 at 60 s, ~170 at 120 s in the v5 log) -> conservative in VALUE,
# while the GRADIENT along a uniform merge-zone speed change is several times the position term's.
# Check loss_share.jsonl / merge_value_share after the first steps; adjust with --set loss.merge.*_weight.
schema_version = 2
name = "WM-S-C4-V7FT"
extends = "c4_wm_v5m_refresh.toml"

[model]
init_from = "ckpt_v5m"   # launch: --set model.init_from=<abs path of the v5m checkpoint>

[[data.c4_sources]]
name = "native_v5"
path = "v5_native"          # WMS_DATA_V5_NATIVE
mix_ratio = 0.40
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_plain"
path = "genrand_plain"      # WMS_DATA_GENRAND_PLAIN
mix_ratio = 0.20
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "v6_policy"
path = "v6_policy"          # WMS_DATA_V6_POLICY (converted Dreamer-loop policy SUMO episodes)
mix_ratio = 0.35
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_branch"
path = "genrand_branch"     # WMS_DATA_GENRAND_BRANCH (v5 60 s branches)
mix_ratio = 0.05
window_stride_s = 10.0
use_val = true
paired = true

[loss.merge]
speed_weight = 10.0
discharge_weight = 20.0
cell_edges_m = [-100.0, 0.0, 75.44, 300.0]
line_m = 75.44
bin_s = 5.0
cell_temp_m = 2.0
cross_temp_m = 5.0
speed_scale_mps = 1.0
discharge_scale_veh = 2.0

[curriculum]
# v5m refresh: 100 steps at [60, 120] s ~ 70 min on the RTX 4080S -> 250 steps ~ 3 h
unroll_s = [60.0, 120.0]
stage_steps = [150, 100]
truncation_steps_per_stage = [120, 120]
max_hours = 3.5

[optim]
lr_per_stage = [1.0e-4, 5.0e-5]

[selection]
val_every = 50

[runtime]
out_dir = "runs/active/c4_wm_v7ft"
