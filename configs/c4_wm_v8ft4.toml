# V8FT4 (full run of pre-check 4; owner 2026-10-18 auto-chain if pre-check 4 passes): c4_wm_v8ft2.toml
# (rules OFF in training / ON at inference, forced-window hazard 0.02, zone yield, follower 1.0/0.6) + merge
# impatience in training and inference, merge_timing 6, gradient-share probe off (OOMs at 120 s on 24 GB).
# Launch: --set model.init_from=<abs path of the v5m checkpoint (wm_s_best_ap.pt)>.
schema_version = 2
name = "WM-S-C4-V8FT4"
extends = "c4_wm_v8ft2.toml"

[physics.overrides]
merge_impatience = true
merge_impatience_distance_m = 25.0
merge_impatience_speed_mps = 1.0
merge_impatience_hazard_tau_s = 25.0
merge_impatience_gap_tau_s = 25.0
merge_impatience_s0_min_m = 0.5
merge_impatience_t_min_s = 0.1

[loss]
loss_share_logging = false

[loss.merge_timing]
weight = 6.0

[runtime]
out_dir = "runs/active/c4_wm_v8ft4"
