# V8FT pre-check (~1 h on an RTX 4090): c4_wm_v8ft.toml with stage_steps [80, 60].
# Same launch: --set model.init_from=<abs path of the v5m checkpoint>.
schema_version = 2
name = "WM-S-C4-V8FT-SHORT"
extends = "c4_wm_v8ft.toml"

[curriculum]
stage_steps = [80, 60]
max_hours = 1.75

[runtime]
out_dir = "runs/active/c4_wm_v8ft_short"
