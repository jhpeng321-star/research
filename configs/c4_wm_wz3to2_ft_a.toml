# WM-E (2026-11-06) wz3to2 lane-drop fine-tune, PHASE A = core + geometry recalibration.
#
# Init (set by tools/wzwm/run.py via --set model.init_from): INIT_WZ.pt = WM2 (accepted loop
# cycle-2 WM, sha256 b8797242c6b736b57eb17b1aed77d2cf01d813770342f9e17ba33dc5b8b33436; incumbent
# per REGISTRATION 2026-10-29 10:50 and 2026-11-01 11:48) with ONLY the merge-map-geometry tensors
# re-initialised to the model's own fresh initialisation (tools/wzwm/reinit.py: merge_pivot.*,
# merge_core.*, merge_yield.*, ramp_speed_adapt.*).  Every other tensor is WM2 byte-for-byte.
#
# Recipe = R16 stage A (13E core recalibration in physical driver mode: driver_encoder.head x10,
# driver_encoder.centre_logits x1000, merge_yield x1000, ramp_speed_adapt x1000; residual and
# courtesy OFF; 30 x 120 s, truncation 120, lr 5e-5, batch 4) plus R9 (the eight first-passage
# merge_pivot scalars trainable at lr_scale 20 with the teacher-forced merge likelihood
# tf_weight 0.6), because merge_pivot is re-initialised for the closing lane.  Driver settings
# stay learned from prediction error only (driver_param_init = checkpoint; no driver sidecar,
# no physics_params file, no type labels: tools/wzwm/guard.py fails closed otherwise).
#
# Data: no packs; every window comes from the wz3to2 C4 sources (WM-A converter, map wz3to2,
# K = 512).  The launcher REPLACES data.c4_sources / data.c4_base with the WM-B binding; the
# entry below is a placeholder.  Validation = the sources' world-grouped split (wms.data.c4_pairs
# .world_roles: a world is validation everywhere if it is validation in any source).
# Extends round2 directly (loader extends-depth limit), exactly like the R16 A/B presets.
schema_version = 2
name = "WM-S-C4-WZ3TO2-FT-A"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true
checkpoint_forward = true
merge_negotiation = false
driver_param_mode = "physical"
driver_param_init = "checkpoint"
residual_accel_reinit = false
follower_courtesy_init_zero = false
temporal_accel_off = true
residual_accel_off = true
follower_courtesy_off = true
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false
follower_courtesy_version = 2
follower_courtesy_state_grad = true
follower_courtesy_intent = "pivot"
mainline_merge_yield_learnable = true
ramp_speed_adapt_learnable = true

[physics]
emergency_braking = true
secure_gap_veto = true
lane_change_secure_gap = true
emergency_onset = "driver_b"
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[data]
c4_base = "wz_native"

[[data.c4_sources]]
name = "wz_native"
path = "wz_native"          # placeholder: replaced by the launcher's WM-B source binding
mix_ratio = 0.5
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "wz_mappo_u0"
path = "wz_mappo_u0"        # placeholder: replaced by the launcher's WM-B source binding
mix_ratio = 0.5
window_stride_s = 10.0
use_val = true

[data.replay]
low_share_oversample = 1.69
low_share_max = 0.15
low_share_min_stage_s = 120.0

[loss]
recorded_replay_present = "filled"

# No paired-branch source on wz3to2 by default (the launcher re-enables the WM2 values
# weight 1.0 / fraction 0.25 only if a bound source is paired).
[loss.paired_diff]
weight = 0.0
fraction = 0.0

# Through-lane exit of the projected wz3to2 frame (WM_PORT_API road.road_end_m; merge map 553.33).
# The bottleneck sections stay relative to the closing-lane end (s = 75.44 on both maps).
[loss.agg_delay]
road_end_m = 1379.44

[loss.merge_core]
version = 2
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.cutin_reaction]
weight = 0.0

[loss.driver_prior]
weight = 0.0

[loss.follower_courtesy]
weight = 0.0
huber_delta_mps2 = 1.0
contrast = false

[curriculum]
unroll_s = [120.0]
stage_steps = [30]
truncation_steps_per_stage = [120]
max_hours = 2.5

[optim]
lr_per_stage = [5.0e-5]
batch_size_per_stage = [4]
freeze_prefixes = [
  "driver_encoder.history_proj", "driver_encoder.query", "driver_encoder.interaction_proj",
  "driver_encoder.history_gru", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "residual_net", "temporal", "follower_courtesy",
]

[optim.lr_scale]
"driver_encoder.head" = 10.0
"driver_encoder.centre_logits" = 1000.0
"merge_yield" = 1000.0
"ramp_speed_adapt" = 1000.0
"merge_pivot" = 20.0

[selection]
val_max_windows = 4

[runtime]
out_dir = "runs/c4_wm_wz3to2_ft_a"
