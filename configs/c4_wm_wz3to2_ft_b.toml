# WM-E (2026-11-06) wz3to2 lane-drop fine-tune, PHASE B = residual + courtesy.
#
# Init (set by tools/wzwm/run.py): phase-A FINAL wm_s.pt.
# Recipe = R16 stage B (13C schedule: residual + follower courtesy ON with the learned core FROZEN -
# driver encoder, merge_pivot, merge_yield, ramp_speed_adapt, lane_v5; 120 s x 40 then 300 s x 60,
# truncation 120 / 60, lr 5e-5 / 3e-5, batch 4 / 2; residual_net x0.5 (its lane head frozen),
# follower_courtesy x1000 with the R16 B / loop-FT courtesy loss 9.067 / 4.525 contrast) except that
# the courtesy head is KEPT from the checkpoint (follower_courtesy_init_zero = false, as the loop
# fine-tunes that produced WM1-WM3) instead of being zero-initialised.
# Step counts are the full R16 B recipe; the launcher's 'night' profile shortens the 300 s stage
# by --set (recorded in PLAN.json), never the horizons.
schema_version = 2
name = "WM-S-C4-WZ3TO2-FT-B"
extends = "c4_wm_v10round2.toml"

[model]
merge_decision = "first_passage"
merge_st_width = 1.0
merge_passage_law = "hybrid"
merge_w_init = 1.0
merge_quadrature_order = 32
merge_pivot_state_st = true
checkpoint_forward = true
merge_negotiation = false
driver_param_mode = "physical"
driver_param_init = "checkpoint"
residual_accel_reinit = false
temporal_accel_off = true
residual_accel_off = false
follower_courtesy_off = false
follower_courtesy = true
follower_courtesy_hidden = 32
follower_courtesy_embedding = false
follower_courtesy_rollout_grad = false
follower_courtesy_version = 2
follower_courtesy_init_zero = false
follower_courtesy_state_grad = true
follower_courtesy_intent = "pivot"
mainline_merge_yield_learnable = true
ramp_speed_adapt_learnable = true

[physics]
emergency_braking = true
secure_gap_veto = true
lane_change_secure_gap = true
emergency_onset = "driver_b"
merge_end_wait = false
ramp_lane_end_stop = true
ramp_risk_retain = true

[data]
c4_base = "wz_native"

[[data.c4_sources]]
name = "wz_native"
path = "wz_native"          # placeholder: replaced by the launcher's WM-B source binding
mix_ratio = 0.5
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "wz_mappo_u0"
path = "wz_mappo_u0"        # placeholder: replaced by the launcher's WM-B source binding
mix_ratio = 0.5
window_stride_s = 10.0
use_val = true

[data.replay]
low_share_oversample = 1.69
low_share_max = 0.15
low_share_min_stage_s = 120.0

[loss]
recorded_replay_present = "filled"

[loss.paired_diff]
weight = 0.0
fraction = 0.0

[loss.agg_delay]
road_end_m = 1379.44

[loss.merge_core]
version = 2
weight = 0.0
tf_weight = 0.6
yield_weight = 0.0
metrics = true
pos_tol_m = 50.0
speed_tol_mps = 8.0
gap_tol_m = 40.0
gap_speed_tol_mps = 8.0
location_reg_weight = 0.0
sigma_reg_weight = 0.0
tau_reg_weight = 0.0
w_reg_weight = 0.0
z_tf = 395.2
z_on = 2.15

[loss.merge_survival]
weight = 0.0
negative_weight = 0.0

[loss.cutin_reaction]
weight = 0.0

[loss.driver_prior]
weight = 0.0

[loss.follower_courtesy]
weight = 9.067
huber_delta_mps2 = 1.0
contrast = true
absolute_weight = 4.525

[curriculum]
unroll_s = [120.0, 300.0]
stage_steps = [40, 60]
truncation_steps_per_stage = [120, 60]
max_hours = 8.0

[optim]
lr_per_stage = [5.0e-5, 3.0e-5]
batch_size_per_stage = [4, 2]
freeze_prefixes = [
  "driver_encoder", "driver_updater", "gate_", "lane_gate_", "history_proj", "k_embedding",
  "lane_v5", "merge_core", "merge_pivot", "residual_net.lane", "temporal", "merge_yield",
  "ramp_speed_adapt",
]

[optim.lr_scale]
"residual_net" = 0.5
"follower_courtesy" = 1000.0

[selection]
val_max_windows = 16

[runtime]
out_dir = "runs/c4_wm_wz3to2_ft_b"
