# S-RB-INT recipe; consumption requires all three physics branches integrated.
# Start from a strictly loaded WM2 checkpoint and preserve its motion encoder.
schema = "wm_phys/1"

[physics]
cf_model = "sumo_idm"
merge_model = "sumo"
lane_learnable = false
merge_cal = false
merge_end_wait = false
mainline_merge_yield = false
merge_impatience = false
gap_stopped_relax = false
secure_gap_veto = false

[model]
rollout_mode = "driver_params"
lane_model = "lc2013"
lane_head = "off"
merge_decision = "hazard"
merge_response = false
merge_negotiation = false
follower_courtesy = false
follower_courtesy_version = 1
follower_courtesy_intent = "none"
follower_courtesy_off = true
mainline_merge_yield_learnable = false
ramp_speed_adapt_learnable = false
mainline_interaction_residual = false
residual_accel_off = true
temporal_accel_off = true
temporal_accel_lane_bias = false
temporal_accel_state_table = false
driver_update = "off"

[variants.A]
driver_settings = "encoder_inferred"

[variants.B]
driver_settings = "population_default"

[inference]
training = false
learned_acceleration_noise = false
learned_admission = false
learned_lane_corrections = false
learned_merge_corrections = false
conserve_queue = true
future_observation_inputs = false

[smoke]
worlds = [969420, 969421]
arm = "native"
t0_s = 300
duration_s = 60
variants = ["A", "B"]
arrivals = false
# Closed-cohort engineering gate; the registered full-panel harness adds demand
# and its explicit admission/source ledger after this gate passes.
