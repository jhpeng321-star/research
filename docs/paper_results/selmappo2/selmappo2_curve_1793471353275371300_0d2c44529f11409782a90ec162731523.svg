<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" role="img" aria-labelledby="title desc">
<title id="title">SELMAPPO2 training learning curve</title>
<desc id="desc">Mean J600 per complete update of 46 fresh training episodes; lower is better. Cumulative actual simulation includes warmup and two smokes. This is training performance, not held-out evaluation.</desc>
<rect width="920" height="440" fill="white"/>
<g font-family="sans-serif" font-size="13" fill="#222">
<text x="100" y="28">SELMAPPO2 — training J600 (lower is better)</text>
<path d="M100.00,60 V350" stroke="#eee"/>
<text x="100.00" y="375" text-anchor="middle">0</text>
<text x="90" y="354.00" text-anchor="end">53,758.7</text>
<path d="M287.50,60 V350" stroke="#eee"/>
<text x="287.50" y="375" text-anchor="middle">31,350</text>
<text x="90" y="281.50" text-anchor="end">55,129.4</text>
<path d="M475.00,60 V350" stroke="#eee"/>
<text x="475.00" y="375" text-anchor="middle">62,700</text>
<text x="90" y="209.00" text-anchor="end">56,500.1</text>
<path d="M662.50,60 V350" stroke="#eee"/>
<text x="662.50" y="375" text-anchor="middle">94,050</text>
<text x="90" y="136.50" text-anchor="end">57,870.9</text>
<path d="M850.00,60 V350" stroke="#eee"/>
<text x="850.00" y="375" text-anchor="middle">125,400</text>
<text x="90" y="64.00" text-anchor="end">59,241.6</text>
<polyline points="354.78,125.89 602.39,318.98 850.00,91.02" fill="none" stroke="#176b9b" stroke-width="2"/>
<circle cx="354.78" cy="125.89" r="2.5" fill="#176b9b"/>
<circle cx="602.39" cy="318.98" r="2.5" fill="#176b9b"/>
<circle cx="850.00" cy="91.02" r="2.5" fill="#176b9b"/>
<path d="M100,60 V350 H850" fill="none" stroke="#222"/>
<text x="475" y="410" text-anchor="middle">Cumulative actual simulation (s)</text>
<text transform="translate(22,205) rotate(-90)" text-anchor="middle">Mean J600</text>
</g></svg>
