# V8FT (owner-approved 2026-10-17): v5m fine-tune with the v8 merge/ramp fixes.
# Why: runs/active/C4-V7FT-20261017/wm_diag/WM_DIAGNOSIS_v7.md.  v7's cell-mean merge loss (weights 10/20)
# took 27-48 % of every clipped update, drove the approach 2-5 m/s too fast and released ramp cars early;
# training with merge_end_wait / mainline_merge_yield ON made the learned parts lean on the veto; both
# v5m and v7 leave 66-86/736 ramp cars stuck in lane 2 (SUMO 13).
# Changes vs c4_wm_v7ft.toml (same data mix, init from v5m):
#   * physics: switches OFF in training, ON at inference ([physics.inference] -> physics.json; the
#     training physics is kept as physics_train.json; evaluators / the Dreamer policy trainer load physics.json).
#   * loss.merge: only the downstream speed cell [75.44, 300) m (speed_cells = [2]), discharge 20 -> 5,
#     value-share cap 0.15 of each chunk's loss (max_share; value, not gradient norm - see merge.py).
#   * loss.merge_timing (new): per-ramp-vehicle survival NLL of the recorded lane-2 departure under the
#     model's own merge hazard on its free-running rollout (wms.train.losses.merge_timing).
#     weight 2.0 = ESTIMATE (no training data on the authoring host): v7ft's first 60 s steps from v5m had
#     position ~94 (120 s: ~146); a calibrated head (teacher-forced merge rows: 8.8 %/step) gives
#     ~0.09 nats per survived feasible step + ~2.4 per event, i.e. ~3-5 nats per ramp vehicle -> 6-10
#     = 6-10 % of the position loss at 60 s, ~5 % at 120 s.  Check merge_timing_value_share in the first
#     train_log rows (target 0.05-0.10); adjust with --set loss.merge_timing.weight=<w>.
#   * selection: multi_horizon_v2 + ramp terms (final comparison: 0.25 x ramp-HDV |ds| ratio to the best
#     candidate + 1.0 x |stuck_pred - stuck_rec| at 60 / 120 s).
# Launch: --set model.init_from=<abs path of the v5m checkpoint (wm_s_best_ap.pt)>.
schema_version = 2
name = "WM-S-C4-V8FT"
extends = "c4_wm_v7ft.toml"

[physics]
merge_end_wait = false
mainline_merge_yield = false

[physics.inference]
merge_end_wait = true
mainline_merge_yield = true

[loss.merge]
speed_weight = 10.0
discharge_weight = 5.0
speed_cells = [2]          # cell_edges_m [-100, 0, 75.44, 300] -> cell 2 = [75.44, 300) m
max_share = 0.15

[loss.merge_timing]
weight = 2.0

[curriculum]
unroll_s = [60.0, 120.0]
stage_steps = [300, 250]   # ~19 s/step at 60 s, ~30 s/step at 120 s on an RTX 4090 (v7ft) -> ~3.7 h + val
truncation_steps_per_stage = [120, 120]
max_hours = 5.0
selection_ramp_weight = 0.25
selection_stuck_weight = 1.0

[optim]
lr_per_stage = [1.0e-4, 5.0e-5]

[selection]
val_every = 50

[runtime]
out_dir = "runs/active/c4_wm_v8ft"
