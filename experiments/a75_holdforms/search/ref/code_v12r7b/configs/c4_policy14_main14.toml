# MAIN14: full owner-approved gated curriculum on the 24 GB gpuR.
# Batch 1, two driver futures, checkpointed imagination; CUDA allocator capped by run env.
extends = "c4_policy14_coop.toml"

[trainer]
batch_size = 1
checkpoint_imagination = true

[data]
