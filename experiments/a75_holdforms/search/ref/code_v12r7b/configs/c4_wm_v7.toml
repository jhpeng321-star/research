# V7 (owner 2026-10-17): v5m model/physics trained FROM SCRATCH with the merge-zone calibration loss.
# = c4_wm_v5.toml (model, losses, curriculum 10/30/60/120 s, steps [1200, 900, 650, 250], val_every 400)
# + the v5m merge-zone physics switches + loss.merge (see c4_wm_v7ft.toml for the weight rationale)
# + the Dreamer-loop policy episodes as a fourth source.  No init_from.
# Budget: v5 took 9.3 h for these steps on an RTX 4080S; an RTX 4090 is ~1.4x faster -> ~6.6 h (+ merge
# loss overhead, small); max_hours 8.  After training: lane AP calibration (tools/lanehazard_calib.py --write-ap).
schema_version = 2
name = "WM-S-C4-V7"
extends = "c4_wm_v5.toml"

[physics]
merge_end_wait = true
mainline_merge_yield = true

[[data.c4_sources]]
name = "native_v5"
path = "v5_native"          # WMS_DATA_V5_NATIVE
mix_ratio = 0.45
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_plain"
path = "genrand_plain"      # WMS_DATA_GENRAND_PLAIN
mix_ratio = 0.20
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "v6_policy"
path = "v6_policy"          # WMS_DATA_V6_POLICY (converted Dreamer-loop policy SUMO episodes)
mix_ratio = 0.30
window_stride_s = 10.0
use_val = true

[[data.c4_sources]]
name = "genrand_branch"
path = "genrand_branch"     # WMS_DATA_GENRAND_BRANCH (v5 60 s branches)
mix_ratio = 0.05
window_stride_s = 10.0
use_val = true
paired = true

[loss.merge]
speed_weight = 10.0
discharge_weight = 20.0
cell_edges_m = [-100.0, 0.0, 75.44, 300.0]
line_m = 75.44
bin_s = 5.0
cell_temp_m = 2.0
cross_temp_m = 5.0
speed_scale_mps = 1.0
discharge_scale_veh = 2.0

[curriculum]
max_hours = 8.0

[runtime]
out_dir = "runs/active/c4_wm_v7"
