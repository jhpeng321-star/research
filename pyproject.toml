[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "wms"
version = "0.1.0"
description = "WM-S: physics-informed next-state world model for mixed CAV/HDV traffic"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
parallel-futures = ["cloudpickle>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wms = ["model/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
cache_dir = "runs/active/.pytest_cache"
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["archive", "runs", "output", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# frozen sim test (content untouched): keeps its unused `real` reference
"tests/test_workflow_write_json_retry.py" = ["F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
